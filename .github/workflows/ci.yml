name: CI

on:
  push:
    branches: [main, 'fm/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: shellcheck bin/*.sh tests/*.sh

  tests:
    name: Behavior tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          set -eu
          tests/run-tests.sh

  macos-bash-32:
    name: Supervisor on macOS Bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          set -eu
          version=$(/bin/bash -c 'printf "%s.%s\n" "${BASH_VERSINFO[0]}" "${BASH_VERSINFO[1]}"')
          [ "$version" = "3.2" ] || {
            echo "::error::Expected /bin/bash 3.2, found $version"
            exit 1
          }
          bash_guard="$RUNNER_TEMP/require-system-bash"
          printf '%s\n' \
            'case "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" in' \
            '  3.2) ;;' \
            '  *) printf "Expected Bash 3.2 child, found %s.%s\n" "${BASH_VERSINFO[0]}" "${BASH_VERSINFO[1]}" >&2; exit 97 ;;' \
            'esac' > "$bash_guard"
          PATH=/bin:/usr/bin BASH_ENV="$bash_guard" /bin/bash tests/fm-supervisor.test.sh

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Symlinks must stay intact
        run: |
          set -eu
          [ "$(readlink CLAUDE.md)" = "AGENTS.md" ] || { echo "::error::CLAUDE.md must be a symlink to AGENTS.md"; exit 1; }
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
